# MeshPotato settings
#
# Copy this file to config.toml next to run_bot.py and change what you need:
#   cp config.example.toml config.toml
#
# config.toml is ignored by git, so `git pull` never clashes with your edits.
# Any setting left out keeps the default in run_bot.py. Needs Python 3.11 or newer.
#
# If you put your API key in here, keep the file private:
#   chmod 600 config.toml

# ---------- Met Office ----------
# Paste the whole key (about 1670 characters) on one line between the quotes.
# The METOFFICE_API_KEY environment variable wins over this if both are set.
# metoffice_api_key = "paste-your-key-here"

# ---------- Radio ----------
# serial_port = "/dev/ttyACM0"      # --port on the command line wins over this
# channel_idxs = [1, 3]             # channels the bot listens and replies on
# answer_dms = true
# timezone = "Europe/London"
# log_level = "INFO"                # DEBUG also logs messages that aren't commands

# ---------- Weather ----------
# default_location = "Norwich"
# wx_cache_sec = 1800               # reuse a forecast for 30 min
# wx_daily_call_budget = 300        # Met Office calls per UTC day (free tier: 360)
# use_emoji = true
# use_mph = true
# dist_miles = false                # true = !dist in miles instead of km
# wxh_hours = 6
# wxh_step_hours = 1
# warn_cache_sec = 600              # reuse the Met Office warnings feed for 10 min

# ---------- Weather warning alerts ----------
# After someone sends !warn, the bot keeps checking that region and posts to the
# same channel or DM when the warnings change. Nothing is posted until someone asks.
# warn_watch_hours = 24             # keep posting changes for this long after the last !warn
# warn_watch_max = 10               # most regions and channels watched at once
# warn_watch_tick_sec = 60          # how often watched regions are checked (the feed is still cached)

# ---------- Aurora (AuroraWatch UK) ----------
# aurora_cache_sec = 300            # reuse the data for 5 min. AuroraWatch UK asks for no more than
#                                   # one request per 3 min, so anything under 180 is raised to 180

# ---------- Air quality and pollen (Open-Meteo) ----------
# air_cache_sec = 3600              # reuse a place's air quality and pollen for 1 hour
# Pollen counts (grains/m³) where Moderate, High and Very high start. Grass uses the
# Met Office scale. Types left out (birch, alder, mugwort, ragweed) show the count only.
# pollen_levels = { grass = [30, 50, 150] }   # add e.g. birch = [...] with your own thresholds

# ---------- Radio conditions ----------
# hf_cache_sec = 3600               # N0NBH HF/VHF feed. N0NBH asks for hourly fetches at most,
#                                   # so anything under 3600 is raised to 3600
# tropo_cache_sec = 3600            # UHF tropo forecast per place (Open-Meteo)

# Named places for !wx <name>. This replaces the built-in list.
# [locations]
# Norwich = [52.6278, 1.2983]
# Cambridge = [52.205276, 0.119167]
# Ipswich = [52.0592, 1.1555]

# ---------- Rate limits: [max commands, seconds] ----------
# rate_limit_per_user = [3, 60]
# rate_limit_per_channel = [8, 60]
# rate_limit_global = [20, 60]
# rate_limit_notify = true
# min_tx_gap_sec = 3.0
# admin_pubkeys = ["a1b2c3d4e5f6"]  # 12-hex-character key prefixes, DMs only.
#                                   # Skip the limits and can use !stats, !uptime, !mute, !say, !save
# mute_max_minutes = 1440           # longest !mute

# ---------- Fun commands ----------
# roll_max_dice = 10
# roll_max_sides = 1000

# ---------- Who's about: !who, !status ----------
# who_hours = 24                    # !who looks back this far unless given hours
# heard_keep_days = 7               # forget a node not heard for this long
# heard_file = "heard.json"         # saved heard list, next to run_bot.py unless a full path

# ---------- Frequencies: !freq <topic> ----------
# Adds topics to the built-in pmr, cb, ham, hf, marine and air, or replaces one with
# the same name. An empty string removes a topic. Keep each under about 120 characters.
# [freq_lists]
# local = "GB3XX 145.7250 -600k CTCSS 94.8"
# air = ""

# ---------- Scheduled messages ----------
# Any [[scheduled_messages]] entry replaces the whole built-in list.
#
# [[scheduled_messages]]
# name = "morning-wx"
# time = "07:30"
# days = ["mon", "tue", "wed", "thu", "fri"]
# channel = 1
# text = "Morning WX {wx}"
#
# [[scheduled_messages]]
# name = "weekend-fcst"
# time = "08:30"
# days = ["sat", "sun"]
# channel = 1
# text = "{wxf}"
#
# Weather warnings every morning. {warn} uses default_location; {warn:nw} or
# {warn:Cromer} picks a region or place. A scheduled post doesn't start alerts,
# only someone sending !warn does.
# [[scheduled_messages]]
# name = "morning-warnings"
# time = "07:00"
# channel = 1
# text = "{warn}"
#
# [[scheduled_messages]]
# name = "beacon"
# every_minutes = 360
# start = "00:00"
# channel = 3
# text = "WX bot online {time}. Send !help for commands."
